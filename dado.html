<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>CyberBet VIP - Dado dos Times</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter'], display: ['Orbitron'] } } } }
  </script>
</head>
<body class="bg-[#080811] text-gray-200 min-h-screen flex flex-col justify-between">

  <header class="bg-[#121220]/80 backdrop-blur border-b border-[#2a2a48] px-6 py-3 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <h1 class="font-display font-black text-xl text-white">CYBER<span class="text-[#ff007f]">BET</span> VIP</h1>
      <div class="flex items-center gap-4">
        <div class="bg-[#0a0a12] border border-[#2a2a48] px-4 py-1.5 rounded-xl text-right">
          <span class="text-[10px] text-gray-400 block uppercase">Saldo</span>
          <span id="user-balance" class="font-display font-bold text-[#00ff66]">R$ 100,00</span>
        </div>
        <button onclick="logout()" class="text-gray-400 hover:text-red-400"><i class="fa-solid fa-right-from-bracket"></i></button>
      </div>
    </div>
  </header>

  <nav class="max-w-7xl mx-auto w-full px-4 pt-6">
    <div class="grid grid-cols-4 gap-3 bg-[#121220] p-2 rounded-2xl border border-[#2a2a48]">
      <a href="bingo.html" class="py-3 text-center font-display font-bold text-xs text-gray-400 hover:text-white"><i class="fa-solid fa-circle-dot text-[#ff007f] mr-1"></i> BINGO</a>
      <a href="dado.html" class="py-3 text-center font-display font-bold text-xs bg-[#00f3ff]/20 text-white border border-[#00f3ff] rounded-xl"><i class="fa-solid fa-dice-d6 text-[#00f3ff] mr-1"></i> DADO</a>
      <a href="tiger.html" class="py-3 text-center font-display font-bold text-xs text-gray-400 hover:text-white"><i class="fa-solid fa-cat text-[#ffcc00] mr-1"></i> TIGER</a>
      <a href="aviador.html" class="py-3 text-center font-display font-bold text-xs text-gray-400 hover:text-white"><i class="fa-solid fa-plane-up text-red-500 mr-1"></i> AVIADOR</a>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto w-full px-4 py-6 flex-1">
    <div class="bg-[#121220] p-6 rounded-3xl border border-[#2a2a48] text-center max-w-xl mx-auto">
      <h2 class="font-display font-black text-2xl mb-2">DADO DOS TIMES (5.50x)</h2>
      <p class="text-xs text-gray-400 mb-6">Escolha um time e lance o dado!</p>

      <div class="grid grid-cols-3 gap-3 mb-6" id="teams-grid"></div>

      <button onclick="rollDice()" class="w-full py-4 bg-[#00f3ff] text-black font-display font-black uppercase rounded-xl">Lançar Dado (R$ 10,00)</button>
      <div id="dice-result" class="mt-4 font-display font-bold text-lg text-white"></div>
    </div>
  </main>

  <script>
    let balance = parseFloat(localStorage.getItem('userBalance') || '100.00');
    let selectedTeam = 1;
    const teams = ['Flamengo', 'São Paulo', 'Palmeiras', 'Vasco', 'Corinthians', 'Grêmio'];

    function updateBalance() {
      document.getElementById('user-balance').innerText = `R$ ${balance.toFixed(2).replace('.', ',')}`;
      localStorage.setItem('userBalance', balance.toFixed(2));
    }

    function init() {
      if(localStorage.getItem('isLoggedIn') !== 'true') window.location.href = 'index.html';
      updateBalance();

      const grid = document.getElementById('teams-grid');
      grid.innerHTML = teams.map((t, i) => `
        <div onclick="selectedTeam=${i+1}; selectTeam(${i+1})" id="t-${i+1}" class="p-3 bg-[#0a0a12] border ${i===0?'border-[#ff007f]':'border-[#2a2a48]'} rounded-xl cursor-pointer">
          <span class="text-xs font-bold text-[#ff007f]">Nº ${i+1}</span>
          <p class="text-xs font-bold mt-1 text-white">${t}</p>
        </div>
      `).join('');
    }

    function selectTeam(id) {
      document.querySelectorAll('[id^="t-"]').forEach(el => el.classList.remove('border-[#ff007f]'));
      document.getElementById(`t-${id}`).classList.add('border-[#ff007f]');
    }

    function rollDice() {
      if(balance < 10) return alert('Saldo insuficiente!');
      balance -= 10;
      updateBalance();

      let res = Math.floor(Math.random() * 6) + 1;
      document.getElementById('dice-result').innerText = `Sorteado: Nº ${res} (${teams[res-1]})`;

      if(res === selectedTeam) {
        balance += 55;
        updateBalance();
        alert(`Ganhou R$ 55,00 no ${teams[res-1]}!`);
      }
    }

    function logout() { localStorage.removeItem('isLoggedIn'); window.location.href = 'index.html'; }
    window.onload = init;
  </script>
</body>
</html>
